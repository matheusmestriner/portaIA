name: Portalia
options:
  bundleIdPrefix: com.portalia
  deploymentTarget:
    iOS: "17.0"

packages:
  PortaliaCore:
    path: PortaliaCore

targets:
  Portalia:
    type: application
    platform: iOS
    sources:
      - path: Portalia/Sources
    info:
      path: Portalia/Info.plist
      properties:
        CFBundleDisplayName: Portalia
        UILaunchScreen: {}
        UIBackgroundModes:
          - voip
        NSCameraUsageDescription: Usado para escanear o QR code de retirada de entregas.
    entitlements:
      path: Portalia/Portalia.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portalia.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: PortaliaCore
