<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" id="theme-color-meta">
  <meta name="description" content="Tela de login moderna, responsiva e preparada para white-label.">
  <title>Login</title>
  <link rel="stylesheet" href="./css/login.css">
  <script defer src="./js/theme.js"></script>
  <script defer src="./js/waves.js"></script>
  <script defer src="./js/login.js"></script>
</head>
<body>
  <canvas id="waves-canvas" aria-hidden="true"></canvas>

  <main class="login-shell">
    <section class="login-card" id="login-card" aria-labelledby="login-heading">
      <div class="card-reflection" aria-hidden="true"></div>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Alternar tema"
        aria-pressed="false"
      >
        <span class="theme-toggle-icon" id="theme-toggle-icon" aria-hidden="true"></span>
      </button>

      <div class="identity-mark" aria-hidden="true">
        <img id="client-logo" class="client-logo" alt="" hidden>
        <svg id="default-avatar" class="avatar-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="17" r="7" stroke="currentColor" stroke-width="2.4"/>
          <path d="M11 38c1.9-7.2 6.6-10.8 13-10.8S35.1 30.8 37 38" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="login-heading" class="sr-only">Entrar</h1>

      <form id="login-form" class="login-form" novalidate>
        <div class="field-group">
          <label for="email">E-mail</label>
          <div class="input-shell" id="email-shell">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 6.5h16v11H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="m5 8 7 5 7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              placeholder="Digite seu e-mail"
              aria-describedby="email-error"
              aria-invalid="false"
              required
            >
          </div>
          <p class="field-error" id="email-error" role="alert" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <div class="input-shell" id="password-shell">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              aria-describedby="password-error"
              aria-invalid="false"
              required
            >
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Mostrar senha"
              aria-pressed="false"
            >
              <svg class="eye eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <svg class="eye eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
                <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M10.2 7.2A10 10 0 0 1 12 7c6 0 9.5 5 9.5 5a15.9 15.9 0 0 1-3.1 3.4M6.3 8.1A16.5 16.5 0 0 0 2.5 12s3.5 5 9.5 5a10 10 0 0 0 2.3-.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p class="field-error" id="password-error" role="alert" aria-live="polite"></p>
        </div>

        <button type="submit" class="submit-button" id="submit-button">
          <span class="spinner" id="submit-spinner" aria-hidden="true" hidden></span>
          <span id="submit-label">Entrar</span>
        </button>

        <a class="forgot-link" href="#" id="forgot-link">Esqueci minha senha</a>

        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
