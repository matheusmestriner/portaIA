services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portaria
      POSTGRES_PASSWORD: portaria
      POSTGRES_DB: portariaflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports: ["8554:8554", "8888:8888", "8889:8889"]
  backend:
    build: ./backend
    env_file: .env.example
    depends_on: [postgres, redis, minio, whatsapp]
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
  whatsapp:
    build: ./services/whatsapp
    environment:
      PORT: 8081
      RATE_PER_MINUTE: 20
    ports: ["8081:8081"]
volumes:
  pgdata:
  minio:
